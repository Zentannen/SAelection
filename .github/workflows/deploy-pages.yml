name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/intelligent-maxwell-egkihk]
  workflow_dispatch:
  # Refresh the count every 10 minutes (GitHub only runs schedules from the default branch).
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch the live IEC count for Gauteng
        # Falls back to the committed results.json if the IEC feed is unreachable.
        continue-on-error: true
        env:
          PREVIOUS_RESULTS_URL: https://zentannen.github.io/SAelection/data/results.json
        run: node scripts/fetch-iec-results.mjs
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
